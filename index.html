<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Viewer</title>

    <script src="https://openseadragon.github.io/openseadragon/openseadragon.min.js"></script>

    <style>
        html, body {
            margin: 0;
            height: 100%;
        }

        #viewer {
            width: 100%;
            height: 100vh;
            background: black;
        }
    </style>
</head>

<body>

<div id="viewer"></div>

<script>

var viewer = OpenSeadragon({
    id: "viewer",
    prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
    tileSources: "sortie.dzi",
    showNavigator: false
});


viewer.addHandler('open', function(){

    console.log("Viewer prêt");

    // Tuile charlie
    viewer.addTiledImage({
        tileSource: "charlie1.dzi",
        x: 0.2891011294986858,
        y: 0.3041,
        width: 0.01957575572620729,
        height: 0.022303030672940538,
        opacity: 1,
        preload: true,

        success: () => console.log("Charlie OK")
    });


    // Tuile croquis
    viewer.addTiledImage({
        tileSource: "croquis1.dzi",
        x: 0.4372275814493661,
        y: 0.525,
        width: 0.16669895742216728,
        height: 0.14485691959151004,
        opacity: 0.6,
        preload: true,

        success: () => console.log("Croquis OK")
    });

});

</script>
</body>
</html>
